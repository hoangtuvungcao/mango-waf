version: '3.8'

services:
  mango-shield:
    build: .
    container_name: mango-shield
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /app/logs
    ports:
      - "443:443"
      - "80:80"
      - "9090:9090"
    volumes:
      - ./config:/app/config:ro
      - ./certs:/app/certs:ro
      - ./data:/app/data
      - /sys/fs/bpf:/sys/fs/bpf
    environment:
      - TZ=Asia/Ho_Chi_Minh
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - BPF
      - PERFMON
    networks:
      - shield-net
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:9090/api/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

networks:
  shield-net:
    driver: bridge
