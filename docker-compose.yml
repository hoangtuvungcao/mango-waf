services:
  mango-shield:
    build: .
    container_name: mango-shield
    command: [ "-config", "config/production.yaml" ]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:false
    tmpfs:
      - /tmp
      - /app/logs
    ports:
      - "443:443"
      - "80:80"
      - "9090:9090"
      - "9100:9100"
    volumes:
      - ./config:/app/config:ro
      - ./certs:/app/certs
      - ./data:/app/data
      - /sys/fs/bpf:/sys/fs/bpf
    environment:
      - TZ=Asia/Ho_Chi_Minh
    cap_add:
      - NET_ADMIN
      - BPF
      - PERFMON
      - SYS_ADMIN
    networks:
      - shield-net
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:9090/api/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  test-site:
    build:
      context: .
      dockerfile_inline: |
        FROM golang:1.24-alpine AS builder
        WORKDIR /app
        COPY go.mod go.sum ./
        RUN go mod download
        COPY . .
        RUN CGO_ENABLED=0 GOOS=linux go build -ldflags="-s -w" -o /test-site ./test-site/server.go
        FROM alpine:3.20
        WORKDIR /app
        COPY --from=builder /test-site /app/test-site
        EXPOSE 8080
        ENTRYPOINT ["/app/test-site"]
    container_name: mango-test-site
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      shield-net:
        aliases:
          - test-site
          - mango-test-site
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - MANGO_DOMAIN=firewall.hidev.dev
      - MANGO_API_URL=http://mango-shield:9090

networks:
  shield-net:
    driver: bridge
