name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build & Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go 1.24
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev linux-tools-common

      - name: Verify Code Formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "The following files are not formatted properly:"
            gofmt -l .
            exit 1
          fi

      - name: Run Go Vet
        run: go vet ./...

      - name: Run Unit & Integration Tests
        run: go test -v -cover ./...

      - name: Run Data Race Detector
        run: go test -race ./...

      - name: Run Performance Benchmarks
        run: go test -bench=. -benchmem ./...

      - name: Verify Binary Build
        run: go build -o bin/mango-shield ./cmd/cli

      - name: Verify Docker Container Build
        run: docker build -t mango-shield:latest .
