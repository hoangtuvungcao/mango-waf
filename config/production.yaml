# ==============================================================================
# MANGO SHIELD WAF v2.0 — Enterprise Production Configuration
# Target Domain: firewall.hidev.dev (Cloudflare SSL Full Proxy)
# Architecture: eBPF/XDP Kernel Filter + Go L7 Reverse Proxy Engine
# ==============================================================================

# ------------------------------------------------------------------------------
# SERVER ENGINE SETTINGS
# High-performance HTTP/HTTPS server parameters
# ------------------------------------------------------------------------------
server:
  # Purpose: Primary HTTPS listening socket address and port.
  # Valid Values: "0.0.0.0:443", "127.0.0.1:8443", ":443"
  # Recommended Production Value: "0.0.0.0:443"
  # Performance Impact: Negligible
  # Security Impact: Listens on all interfaces to accept incoming HTTPS traffic.
  listen: "0.0.0.0:443"

  # Purpose: HTTP listening port for HTTP->HTTPS redirection and plain HTTP.
  # Valid Values: "0.0.0.0:80", ":80"
  # Recommended Production Value: "0.0.0.0:80"
  # Performance Impact: Low overhead for HTTP 301/308 redirects.
  # Security Impact: Enforces HTTPS upgrade across all incoming HTTP requests.
  http_listen: "0.0.0.0:80"

  # Purpose: Maximum duration for reading the entire request header and body.
  # Valid Values: Go duration string ("5s", "10s", "30s")
  # Recommended Production Value: 10s
  # Performance Impact: Prevents slowloris connections from tying up worker goroutines.
  # Security Impact: Mitigates L7 Slowloris and Slow Read attacks.
  read_timeout: 10s

  # Purpose: Maximum duration before timing out writes of the response.
  # Valid Values: Go duration string ("15s", "30s", "60s")
  # Recommended Production Value: 30s
  # Performance Impact: High throughput protection under slow client connections.
  # Security Impact: Prevents slow write resource exhaustion.
  write_timeout: 30s

  # Purpose: Maximum amount of time to keep keep-alive connections idle.
  # Valid Values: Go duration string ("30s", "60s", "120s")
  # Recommended Production Value: 60s
  # Performance Impact: Reuses TCP sockets for high RPS while freeing unused conns.
  # Security Impact: Controls idle TCP memory consumption.
  idle_timeout: 60s

  # Purpose: Maximum allowed size of request headers in bytes.
  # Valid Values: 8192 to 1048576 (1KB - 1MB)
  # Recommended Production Value: 1048576 (1 MB)
  # Performance Impact: Low memory allocation per socket buffer.
  # Security Impact: Prevents large header buffer overflow and header flooding attacks.
  max_header_bytes: 1048576

# ------------------------------------------------------------------------------
# TLS / SSL ENGINE
# TLS termination, certificates, and cipher suites
# ------------------------------------------------------------------------------
tls:
  # Purpose: Enable or disable TLS termination engine.
  # Valid Values: true, false
  # Recommended Production Value: true
  # Performance Impact: Requires hardware crypto acceleration (AES-NI).
  # Security Impact: Essential for HTTPS encryption and TLS fingerprinting (JA3/JA4).
  enabled: true

  # Purpose: Path to TLS public certificate chain file (PEM format).
  # Valid Values: File path string ("certs/server.crt", "/etc/ssl/certs/waf.crt")
  # Recommended Production Value: "certs/server.crt"
  # Performance Impact: None
  # Security Impact: Must be readable only by root/WAF daemon.
  cert_file: "certs/server.crt"

  # Purpose: Path to TLS private key file (PEM format).
  # Valid Values: File path string ("certs/server.key", "/etc/ssl/private/waf.key")
  # Recommended Production Value: "certs/server.key"
  # Performance Impact: None
  # Security Impact: Strictly guarded private key file (chmod 0600).
  key_file: "certs/server.key"

  # Purpose: Enable Let's Encrypt / ACME automatic TLS certificate issuance.
  # Valid Values: true, false
  # Recommended Production Value: false (when behind Cloudflare Origin CA)
  # Performance Impact: Background ACME renewals.
  # Security Impact: Automatic 90-day certificate rotation.
  auto_cert: false

  # Purpose: Registration email address for ACME Let's Encrypt account notifications.
  # Valid Values: Email string ("admin@hidev.dev")
  # Recommended Production Value: "admin@hidev.dev"
  # Performance Impact: None
  # Security Impact: Receives expiry warnings if certificate auto-renewal fails.
  acme_email: "admin@hidev.dev"

  # Purpose: Minimum allowed TLS protocol version.
  # Valid Values: "1.2", "1.3"
  # Recommended Production Value: "1.2"
  # Performance Impact: Faster handshakes with 1.3 0-RTT.
  # Security Impact: Blocks insecure SSLv3, TLS 1.0, and TLS 1.1 vulnerable protocols.
  min_version: "1.2"

# ------------------------------------------------------------------------------
# PROTECTED DOMAINS & UPSTREAM PROXY TARGETS
# Reverse proxy routing rules
# ------------------------------------------------------------------------------
domains:
  - name: "firewall.hidev.dev"
    upstreams:
      # Purpose: Upstream target backend application URL.
      # Valid Values: HTTP/HTTPS URL ("http://127.0.0.1:8080", "http://127.0.0.1:8080")
      # Recommended Production Value: "http://127.0.0.1:8080"
      # Performance Impact: Direct internal Docker network routing.
      # Security Impact: Upstream application is shielded behind WAF reverse proxy.
      - url: "http://127.0.0.1:8080"
        weight: 1
    ssl: true

  - name: "localhost"
    upstreams:
      - url: "http://127.0.0.1:8080"
        weight: 1
    ssl: false

# ------------------------------------------------------------------------------
# BACKEND UPSTREAM PROXY TUNING
# HTTP Client connection pool and WebSocket proxying
# ------------------------------------------------------------------------------
proxy:
  # Purpose: Timeout for establishing TCP connection to upstream backend.
  # Valid Values: Go duration string ("3s", "5s", "10s")
  # Recommended Production Value: 5s
  # Performance Impact: Fast failure detection for dead backend nodes.
  # Security Impact: Prevents WAF worker thread hangs when backend is down.
  connect_timeout: 5s

  # Purpose: Timeout for receiving response headers from upstream backend.
  # Valid Values: Go duration string ("15s", "30s", "60s")
  # Recommended Production Value: 30s
  # Performance Impact: Keeps client connection slots open while waiting on backend.
  # Security Impact: Mitigates backend exhaustion caused by slow upstream queries.
  response_timeout: 30s

  # Purpose: Maximum total idle HTTP connections kept open in connection pool.
  # Valid Values: 50 to 5000
  # Recommended Production Value: 100
  # Performance Impact: High throughput via TCP connection reuse.
  # Security Impact: Prevents socket exhaustion on upstream target.
  max_idle_conns: 100

  # Purpose: Keep backend connections alive across requests.
  # Valid Values: true, false
  # Recommended Production Value: true
  # Performance Impact: Reduces TCP handshake latency for backend requests.
  # Security Impact: Low risk.
  keep_alive: true

  # Purpose: Enable transparent WebSocket (RFC 6455) bidirectional proxying.
  # Valid Values: true, false
  # Recommended Production Value: true
  # Performance Impact: Low overhead streaming socket protocol.
  # Security Impact: Inspects initial HTTP Upgrade handshake for malicious headers.
  websocket: true

# ------------------------------------------------------------------------------
# PROTECTION PIPELINE & MITIGATION ENGINES
# L7 Anti-DDoS, Rate Limiting, Connection Limiting, Challenges, and Bans
# ------------------------------------------------------------------------------
protection:
  # Purpose: Global operational mode of WAF pipeline.
  # Valid Values: "off", "detect", "challenge", "block", "auto"
  # Recommended Production Value: "auto"
  # Performance Impact: "auto" scales mitigation dynamically based on threat level.
  # Security Impact: "auto" automatically elevates from silent inspection to JS/PoW challenges under attack.
  mode: "auto"

  # Purpose: IP subnets/addresses completely whitelisted from all inspection.
  # Valid Values: Array of CIDRs or IP strings ("127.0.0.1/32", "10.0.0.0/8")
  # Recommended Production Value: ["127.0.0.1/32"]
  # Performance Impact: Bypasses pipeline instantly for 0ms latency.
  # Security Impact: Must only contain trusted internal administrative IPs.
  whitelist_ips:
    - "127.0.0.1/32"

  # Purpose: Trusted proxy subnets whose X-Forwarded-For headers are trusted.
  # Valid Values: Array of CIDRs (Cloudflare IP ranges, local proxy)
  # Recommended Production Value: Includes Cloudflare IPv4 ranges + 127.0.0.1
  # Performance Impact: Negligible CIDR lookup.
  # Security Impact: CRITICAL for accurately identifying real client IP behind Cloudflare.
  trusted_proxies:
    - "127.0.0.1/32"
    - "172.16.0.0/12"
    - "10.0.0.0/8"
    - "173.245.48.0/20"
    - "103.21.244.0/22"
    - "103.22.200.0/22"
    - "103.31.4.0/22"
    - "141.101.64.0/18"
    - "108.162.192.0/18"
    - "190.93.240.0/20"
    - "188.114.96.0/20"
    - "197.234.240.0/22"
    - "198.41.128.0/17"
    - "162.158.0.0/15"
    - "104.16.0.0/13"
    - "104.24.0.0/14"
    - "172.64.0.0/13"
    - "131.0.72.0/22"

  rate_limit:
    # Purpose: Enable or disable token-bucket L7 rate limiter.
    # Valid Values: true, false
    # Recommended Production Value: true
    # Performance Impact: Lock-free per-IP token bucket lookup.
    # Security Impact: Prevents HTTP flood and brute-force attacks by returning HTTP 429.
    enabled: true

    # Purpose: Sustained allowed request rate per client IP.
    # Valid Values: 5 to 1000 requests per second
    # Recommended Production Value: 100
    # Performance Impact: Drops excess traffic before proxying to backend.
    # Security Impact: Prevents single IP from consuming backend throughput.
    requests_per_second: 100

    # Purpose: Burst request allowance for sudden spikes.
    # Valid Values: 10 to 2000
    # Recommended Production Value: 200
    # Performance Impact: Smooths out legitimate web page asset loading.
    # Security Impact: Absorbs brief bursts while capping sustained floods.
    burst: 200

    # Purpose: Track rate limits per client IP address.
    # Valid Values: true, false
    # Recommended Production Value: true
    # Performance Impact: Per-IP hash table memory allocation.
    # Security Impact: Prevents one client flood from affecting other users.
    per_ip: true

    # Purpose: Dynamically adjust rate limit thresholds when threat score rises.
    # Valid Values: true, false
    # Recommended Production Value: true
    # Performance Impact: Automatically tightens under high server CPU load.
    # Security Impact: Provides autonomous attack mitigation during unexpected surges.
    adaptive: true

  connection_limit:
    # Purpose: Maximum active concurrent TCP/TLS connections allowed per IP.
    # Valid Values: 5 to 500
    # Recommended Production Value: 100
    # Performance Impact: Instant TCP rejection when threshold met.
    # Security Impact: Mitigates connection exhaustion and HTTP/2 Rapid Reset.
    max_per_ip: 100

    # Purpose: Global total concurrent connection limit across all clients.
    # Valid Values: 1000 to 1000000
    # Recommended Production Value: 50000
    # Performance Impact: Protects WAF OS socket descriptors.
    # Security Impact: Protects server kernel from out-of-memory crashes.
    max_total: 50000

  challenge:
    # Purpose: Default Proof-of-Work hash difficulty (number of leading zero hex digits required).
    # Valid Values: 1 to 5
    # Recommended Production Value: 2
    # Performance Impact: CPU intensive on client browser (~100ms), 0ms on server.
    # Security Impact: Completely stops headless HTTP flood bots without real JS engines.
    pow_difficulty: 2

    # Purpose: Automatically increase PoW difficulty under heavy attack traffic.
    # Valid Values: true, false
    # Recommended Production Value: true
    # Performance Impact: Zero server CPU impact.
    # Security Impact: Forces botnets to solve exponentially harder PoW (difficulty 3-4).
    pow_adaptive: true

    # Purpose: Time-to-live for validated challenge clearance cookies.
    # Valid Values: Go duration string ("5m", "15m", "1h", "24h")
    # Recommended Production Value: 1h
    # Performance Impact: Clients solve challenge once per hour.
    # Security Impact: Prevents token replay across multiple days.
    cookie_ttl: 1h

    # Purpose: HMAC secret key used to sign challenge validation cookies.
    # Valid Values: Secret string (Minimum 32 random characters or ${MANGO_COOKIE_SECRET})
    # Recommended Production Value: "${MANGO_COOKIE_SECRET}"
    # Performance Impact: Crypto HMAC computation per request.
    # Security Impact: Prevents attackers from forging clearance cookies.
    cookie_secret: "${MANGO_COOKIE_SECRET}"

  ban:
    # Purpose: Duration for which banned IPs remain blacklisted in memory and XDP.
    # Valid Values: Go duration string ("15m", "1h", "24h", "72h")
    # Recommended Production Value: 1h
    # Performance Impact: Automatic garbage collection of expired ban entries.
    # Security Impact: Temporarily isolates repeat offending IP addresses.
    duration: 1h

    # Purpose: Number of failed challenges or WAF blocks before triggering full IP ban.
    # Valid Values: 3 to 50
    # Recommended Production Value: 10
    # Performance Impact: Instantly pushes IP to eBPF XDP kernel map for 0-CPU drops.
    # Security Impact: Escalates persistent malicious bots to hardware kernel block.
    max_fails: 10

    # Purpose: Push banned IPs down to iptables/ipset as fallback.
    # Valid Values: true, false
    # Recommended Production Value: true
    # Performance Impact: System call execution on ban trigger.
    # Security Impact: Layer 3/4 drop fallback if eBPF/XDP is unavailable.
    use_iptables: true

  emergency:
    # Purpose: Total RPS threshold triggering Under-Attack Emergency Mode.
    # Valid Values: 500 to 100000
    # Recommended Production Value: 5000
    # Performance Impact: Swaps pipeline to strict verification mode.
    # Security Impact: Automatically activates strict challenges across all non-whitelisted traffic.
    rps_threshold: 5000

    # Purpose: Duration to remain in Emergency Mode after RPS drops below threshold.
    # Valid Values: Go duration string ("5m", "10m", "30m")
    # Recommended Production Value: 10m
    # Performance Impact: Prevents rapid mode toggling during intermittent floods.
    # Security Impact: Maintains defense posture until attack ceases completely.
    duration: 10m

    # Purpose: Automatically activate Emergency Mode on RPS surge.
    # Valid Values: true, false
    # Recommended Production Value: true
    # Performance Impact: 0ms reaction time during sudden DDoS surges.
    # Security Impact: Ensures zero downtime during sudden volumetric attacks.
    auto_enable: true

# ------------------------------------------------------------------------------
# TLS & PROTOCOL FINGERPRINTING
# Client identification and anomaly classification via TLS ClientHello
# ------------------------------------------------------------------------------
fingerprint:
  ja3:
    # Purpose: Enable TLS JA3 client fingerprint extraction and validation.
    # Valid Values: true, false
    # Recommended Production Value: true
    # Performance Impact: Minimal string hashing during TLS handshake.
    # Security Impact: Detects malicious HTTP client scripts, curl, python-requests, and Go bots.
    enabled: true

    # Purpose: Block requests with unknown/malformed JA3 fingerprints under attack.
    # Valid Values: true, false
    # Recommended Production Value: false
    # Performance Impact: None
    # Security Impact: Prevents unknown TLS clients from reaching origin.
    block_unknown: false

  ja4:
    # Purpose: Enable next-generation TLS JA4 client fingerprinting.
    # Valid Values: true, false
    # Recommended Production Value: true
    # Performance Impact: Fast string hashing.
    # Security Impact: Classifies client TLS protocol features (TLS version, ciphers, extensions, ALPN).
    enabled: true

  http2:
    # Purpose: Enable HTTP/2 SETTINGS frame fingerprinting (h2fp).
    # Valid Values: true, false
    # Recommended Production Value: true
    # Performance Impact: Inspects initial HTTP/2 SETTINGS frame.
    # Security Impact: Mitigates HTTP/2 Rapid Reset (CVE-2023-44487) and HTTP/2 flood tools.
    enabled: true

  ua_consistency:
    # Purpose: Enable User-Agent header vs TLS fingerprint consistency cross-check.
    # Valid Values: true, false
    # Recommended Production Value: true
    # Performance Impact: Lightweight lookup.
    # Security Impact: Catches bot scripts spoofing Chrome/Firefox User-Agent while using Python/Go TLS stacks.
    enabled: true

    # Purpose: Enforce strict rejection of mismatched UA vs TLS fingerprints.
    # Valid Values: true, false
    # Recommended Production Value: false (set true in high-security environments)
    # Performance Impact: None
    # Security Impact: Rejects spoofed browser headers.
    strict: false

# ------------------------------------------------------------------------------
# THREAT INTELLIGENCE & REPUTATION FEEDS
# GeoIP, AbuseIPDB, and Datacenter ASN inspection
# ------------------------------------------------------------------------------
intelligence:
  geoip:
    # Purpose: Enable MaxMind GeoIP location lookup.
    # Valid Values: true, false
    # Recommended Production Value: true
    # Performance Impact: Sub-millisecond MMDB binary reader.
    # Security Impact: Identifies country of origin for incoming traffic.
    enabled: true

    # Purpose: Path to MaxMind GeoLite2-Country database file.
    # Valid Values: File path string ("data/GeoLite2-Country.mmdb")
    # Recommended Production Value: "data/GeoLite2-Country.mmdb"
    # Performance Impact: None
    # Security Impact: Database must be kept updated via geoipupdate tool.
    db_path: "data/GeoLite2-Country.mmdb"

    # Purpose: ISO country codes to automatically block.
    # Valid Values: Array of 2-letter ISO country codes (e.g. ["CN", "RU", "KP"])
    # Recommended Production Value: [] (empty unless specific geo-blocking is required)
    # Performance Impact: Fast array lookup.
    # Security Impact: Geoblocks high-risk countries.
    blocked_countries: []

    # Purpose: ISO country codes to exclusively allow (if populated).
    # Valid Values: Array of 2-letter ISO country codes
    # Recommended Production Value: []
    # Performance Impact: Fast array lookup.
    # Security Impact: Restricts traffic strictly to designated regions.
    allowed_countries: []

  ip_reputation:
    # Purpose: Enable live IP threat score verification.
    # Valid Values: true, false
    # Recommended Production Value: true
    # Performance Impact: Cached API query.
    # Security Impact: Identifies known malicious proxy, Tor exit, and scanner IPs.
    enabled: true

    # Purpose: AbuseIPDB API key for reputation score lookup.
    # Valid Values: API key string or ${ABUSEIPDB_KEY}
    # Recommended Production Value: "${ABUSEIPDB_KEY}"
    # Performance Impact: None
    # Security Impact: Keeps reputation scores current.
    abuseipdb_key: "${ABUSEIPDB_KEY}"

    # Purpose: Cache duration for queried IP reputation scores.
    # Valid Values: Go duration string ("1h", "12h", "24h")
    # Recommended Production Value: 12h
    # Performance Impact: Reduces external API requests.
    # Security Impact: Balances freshness with API rate limits.
    cache_ttl: 12h

  asn:
    # Purpose: Enable ASN datacenter classification.
    # Valid Values: true, false
    # Recommended Production Value: true
    # Performance Impact: MMDB ASN reader.
    # Security Impact: Identifies cloud/hosting provider networks.
    enabled: true

    # Purpose: Block or challenge traffic originating from cloud hosting ASNs (AWS, DigitalOcean, Hetzner).
    # Valid Values: true, false
    # Recommended Production Value: false (challenge mode recommended instead of hard block)
    # Performance Impact: None
    # Security Impact: Blocks automated cloud server botnets.
    block_datacenter: false

# ------------------------------------------------------------------------------
# BEHAVIORAL & ANOMALY DETECTION ENGINE
# Traffic baseline learning and ML bot classification
# ------------------------------------------------------------------------------
detection:
  baseline:
    # Purpose: Enable statistical traffic baseline profiling.
    # Valid Values: true, false
    # Recommended Production Value: true
    # Performance Impact: Background rolling window aggregator.
    # Security Impact: Establishes normal RPS and URI access patterns.
    enabled: true

    # Purpose: Rolling time window used for computing normal traffic baselines.
    # Valid Values: Go duration string ("15m", "1h", "24h")
    # Recommended Production Value: 15m
    # Performance Impact: Low memory tracking.
    # Security Impact: Detects abnormal traffic spikes relative to recent history.
    learning_period: 15m

  anomaly:
    # Purpose: Enable statistical anomaly detection (z-score analysis).
    # Valid Values: true, false
    # Recommended Production Value: true
    # Performance Impact: Floating point math calculations.
    # Security Impact: Identifies subtle low-and-slow DDoS attacks.
    enabled: true

    # Purpose: Sensitivity multiplier for anomaly detection (lower = more sensitive).
    # Valid Values: 1.0 to 5.0
    # Recommended Production Value: 2.0
    # Performance Impact: None
    # Security Impact: Balances false positive prevention with threat detection.
    sensitivity: 2.0

  bot_classifier:
    # Purpose: Enable ML heuristic bot classification engine.
    # Valid Values: true, false
    # Recommended Production Value: true
    # Performance Impact: Evaluates client request features (headers, timing, path order).
    # Security Impact: Distinguishes legitimate search engine crawlers from malicious scrapers.
    enabled: true

    # Purpose: Path to ML bot classification rules/model file.
    # Valid Values: File path string ("rules/bot_model.json")
    # Recommended Production Value: "rules/bot_model.json"
    # Performance Impact: None
    # Security Impact: High accuracy bot scoring.
    model_path: "rules/bot_model.json"

  session_tracking:
    # Purpose: Enable client session behavior tracking across multiple requests.
    # Valid Values: true, false
    # Recommended Production Value: true
    # Performance Impact: In-memory session table.
    # Security Impact: Tracks request sequence anomalies per user session.
    enabled: true

    # Purpose: Session state inactivity expiration timeout.
    # Valid Values: Go duration string ("10m", "30m", "1h")
    # Recommended Production Value: 30m
    # Performance Impact: Automatic session cleanup.
    # Security Impact: Limits memory footprint of inactive client sessions.
    ttl: 30m

# ------------------------------------------------------------------------------
# WEB APPLICATION FIREWALL (OWASP CRS ENGINE)
# L7 payload inspection for SQLi, XSS, RCE, LFI, and Command Injection
# ------------------------------------------------------------------------------
waf:
  # Purpose: Enable or disable OWASP CRS WAF inspection engine.
  # Valid Values: true, false
  # Recommended Production Value: true
  # Performance Impact: Regex pattern matching on URI, Headers, and Body (~0.2ms latency).
  # Security Impact: CRITICAL for protecting against OWASP Top 10 web vulnerabilities.
  enabled: true

  # Purpose: Enable standard OWASP Core Rule Set v3.3/v4.0 rules.
  # Valid Values: true, false
  # Recommended Production Value: true
  # Performance Impact: Evaluates 26 core rule regex patterns.
  # Security Impact: Protects against SQLi, XSS, RCE, LFI, Path Traversal, and Java Injection (Log4Shell).
  owasp_rules: true

  # Purpose: Directory containing custom WAF rules files.
  # Valid Values: Directory path string ("rules/")
  # Recommended Production Value: "rules/"
  # Performance Impact: None
  # Security Impact: Allows custom enterprise rule additions.
  custom_rules_path: "rules/"

  # Purpose: OWASP CRS Paranoia Level (1 = Low False Positives, 4 = Maximum Strictness).
  # Valid Values: 1, 2, 3, 4
  # Recommended Production Value: 2
  # Performance Impact: Paranoia Level 2 evaluates additional protocol strictness rules.
  # Security Impact: Level 2 provides optimal balance of security vs false positive risk for production.
  paranoia_level: 2

# ------------------------------------------------------------------------------
# AUDIT LOGGING & SECURITY TELEMETRY
# Structured logging, log rotation, and attack logs
# ------------------------------------------------------------------------------
logging:
  # Purpose: Minimum log level to record.
  # Valid Values: "debug", "info", "warn", "error"
  # Recommended Production Value: "info"
  # Performance Impact: "info" reduces disk I/O compared to "debug".
  # Security Impact: Captures all operational events, warnings, and attack blocks.
  level: "info"

  # Purpose: Log output format.
  # Valid Values: "json", "console"
  # Recommended Production Value: "json"
  # Performance Impact: Fast structured JSON serialization.
  # Security Impact: Directly compatible with SIEMs (Datadog, Splunk, Elastic, Grafana Loki).
  format: "json"

  # Purpose: Main application log file path.
  # Valid Values: File path string ("logs/mango-shield.log", "/var/log/mango-shield.log")
  # Recommended Production Value: "logs/mango-shield.log"
  # Performance Impact: Buffered file writer.
  # Security Impact: Central audit trail.
  file: "logs/mango-shield.log"

  # Purpose: Maximum size of log file before trigger log rotation.
  # Valid Values: 10 to 1000 (MB)
  # Recommended Production Value: 100
  # Performance Impact: Prevents disk partition saturation.
  # Security Impact: Preserves historical log data.
  max_size_mb: 100

  # Purpose: Maximum number of old rotated log files to retain.
  # Valid Values: 1 to 50
  # Recommended Production Value: 10
  # Performance Impact: Automatic log cleanup.
  # Security Impact: Retains audit logs for compliance requirements.
  max_backups: 10

  # Purpose: Dedicated JSON log file path for recorded security attack events.
  # Valid Values: File path string ("logs/attack.log")
  # Recommended Production Value: "logs/attack.log"
  # Performance Impact: Asynchronous log append.
  # Security Impact: Streamlined threat analytics without noise.
  attack_log: "logs/attack.log"

# ------------------------------------------------------------------------------
# PROMETHEUS METRICS EXPORTER
# Real-time monitoring metrics endpoint
# ------------------------------------------------------------------------------
metrics:
  # Purpose: Enable Prometheus metrics exporter endpoint.
  # Valid Values: true, false
  # Recommended Production Value: true
  # Performance Impact: Zero overhead atomic metric counters.
  # Security Impact: Provides visibility into WAF operation. Must be network restricted.
  enabled: true

  # Purpose: Listening socket address for Prometheus metrics HTTP server.
  # Valid Values: "0.0.0.0:9100", "127.0.0.1:9100"
  # Recommended Production Value: "0.0.0.0:9100"
  # Performance Impact: None
  # Security Impact: Restrict access via firewall or internal network.
  listen: "0.0.0.0:9100"

  # Purpose: HTTP path for scraping Prometheus metrics.
  # Valid Values: "/metrics"
  # Recommended Production Value: "/metrics"
  # Performance Impact: None
  # Security Impact: Standard OpenMetrics format endpoint.
  path: "/metrics"

# ------------------------------------------------------------------------------
# ADMIN DASHBOARD & MANAGEMENT API
# Security management interface and authentication
# ------------------------------------------------------------------------------
dashboard:
  # Purpose: Enable or disable Web Management Dashboard and Telemetry API.
  # Valid Values: true, false
  # Recommended Production Value: true
  # Performance Impact: Serves lightweight REST APIs and embedded Single-Page App.
  # Security Impact: Management interface must be protected by strong admin credentials.
  enabled: true

  # Purpose: Listening address for Dashboard API.
  # Valid Values: "0.0.0.0:9090", "127.0.0.1:9090"
  # Recommended Production Value: "0.0.0.0:9090"
  # Performance Impact: None
  # Security Impact: Exposes management API port 9090.
  listen: "0.0.0.0:9090"

  # Purpose: Administrator username for Dashboard authentication.
  # Valid Values: Username string ("admin")
  # Recommended Production Value: "admin"
  # Performance Impact: Constant-time string comparison.
  # Security Impact: Protects WAF management APIs from unauthorized access.
  username: "admin"

  # Purpose: Administrator password for Dashboard authentication.
  # Valid Values: Password string or ${MANGO_ADMIN_PASSWORD}
  # Recommended Production Value: "${MANGO_ADMIN_PASSWORD}"
  # Performance Impact: Constant-time string comparison.
  # Security Impact: MUST be set to a strong secret via environment variable in production.
  password: "${MANGO_ADMIN_PASSWORD}"

  # Purpose: Secret key used to sign JWT authentication tokens for API access.
  # Valid Values: Secret string (Minimum 32 bytes) or ${MANGO_JWT_SECRET}
  # Recommended Production Value: "${MANGO_JWT_SECRET}"
  # Performance Impact: HMAC SHA-256 token signing.
  # Security Impact: Secures API requests against session forgery.
  jwt_secret: "${MANGO_JWT_SECRET}"

# ------------------------------------------------------------------------------
# SIEM & INCIDENT NOTIFICATION ALERTS
# Integrations with Telegram, Discord, and Webhook receivers
# ------------------------------------------------------------------------------
alerts:
  telegram:
    # Purpose: Enable Telegram bot incident alerts.
    # Valid Values: true, false
    # Recommended Production Value: false (set true if Telegram bot is configured)
    # Performance Impact: Asynchronous HTTP POST request.
    # Security Impact: Sends instant notifications during DDoS attacks or IP bans.
    enabled: false
    token: "${TELEGRAM_BOT_TOKEN}"
    chat_id: "${TELEGRAM_CHAT_ID}"

  discord:
    # Purpose: Enable Discord Webhook incident alerts.
    # Valid Values: true, false
    # Recommended Production Value: false
    # Performance Impact: Asynchronous HTTP POST request.
    # Security Impact: Sends alert embeds to Discord operations channels.
    enabled: false
    webhook_url: "${DISCORD_WEBHOOK_URL}"

  webhook:
    # Purpose: Enable custom SIEM / SOAR HTTP Webhook notifications.
    # Valid Values: true, false
    # Recommended Production Value: false
    # Performance Impact: Asynchronous HTTP POST payload dispatch.
    # Security Impact: Integrates with custom security operations platforms.
    enabled: false
    url: "${WEBHOOK_URL}"
    secret: "${WEBHOOK_SECRET}"

# ------------------------------------------------------------------------------
# CDN & SMART IN-MEMORY EDGE CACHING
# Static asset caching via Ristretto high-concurrency memory cache
# ------------------------------------------------------------------------------
cdn:
  # Purpose: Enable smart in-memory edge caching for static assets.
  # Valid Values: true, false
  # Recommended Production Value: true
  # Performance Impact: Dramatically increases RPS (>50,000 req/s) by serving static files directly from RAM.
  # Security Impact: Reduces backend load to zero for cached static requests.
  enabled: true

  # Purpose: Maximum RAM allocated to Ristretto in-memory cache in megabytes.
  # Valid Values: 64 to 8192 (MB)
  # Recommended Production Value: 256
  # Performance Impact: Memory bounded LRU cache eviction.
  # Security Impact: Prevents memory exhaustion while maintaining high hit ratio.
  memory_limit_mb: 256

  # Purpose: File extensions automatically cached by CDN engine.
  # Valid Values: Array of extension strings (".css", ".js", ".png", ".jpg", ".svg", ".woff2", ".ico")
  # Recommended Production Value: Standard web assets
  # Performance Impact: Serves static assets at microsecond latency.
  # Security Impact: Low risk.
  static_extensions:
    - ".css"
    - ".js"
    - ".png"
    - ".jpg"
    - ".jpeg"
    - ".gif"
    - ".svg"
    - ".woff"
    - ".woff2"
    - ".ttf"
    - ".ico"
    - ".webp"

  # Purpose: URI paths explicitly bypassed from caching.
  # Valid Values: Array of URI prefixes ("/api/*", "/dashboard/*", "/admin/*")
  # Recommended Production Value: Always bypass API and admin routes
  # Performance Impact: None
  # Security Impact: CRITICAL to prevent caching sensitive API responses or session data.
  bypass_rules:
    - "/api/*"
    - "/dashboard/*"
    - "/admin/*"
    - "/login"

  # Purpose: Cookies whose presence causes cache bypass.
  # Valid Values: Array of cookie names ("session_id", "auth_token")
  # Recommended Production Value: ["session_id", "auth_token"]
  # Performance Impact: Bypasses cache for authenticated users.
  # Security Impact: Prevents personalized user data from leaking into public cache.
  bypass_cookies:
    - "session_id"
    - "auth_token"
    - "mango_admin_session"

  # Purpose: HTTP headers whose presence causes cache bypass.
  # Valid Values: Array of header names ("Authorization", "X-Admin-Key")
  # Recommended Production Value: ["Authorization"]
  # Performance Impact: None
  # Security Impact: Ensures authenticated API requests always reach backend.
  bypass_headers:
    - "Authorization"

# ------------------------------------------------------------------------------
# P2P MESH CLUSTER SYNCHRONIZATION
# Memberlist gossip protocol for multi-node IP ban and state sync
# ------------------------------------------------------------------------------
cluster:
  # Purpose: Enable P2P Mesh node clustering across multiple edge servers.
  # Valid Values: true, false
  # Recommended Production Value: true
  # Performance Impact: Low-bandwidth UDP gossip protocol (~1KB/s).
  # Security Impact: Propagates IP bans across all edge WAF nodes globally within 100ms.
  enabled: true

  # Purpose: Unique name for this cluster node instance.
  # Valid Values: Node name string ("mango-node-primary", "edge-us-east-1")
  # Recommended Production Value: "mango-node-primary"
  # Performance Impact: None
  # Security Impact: Identifies node origin in mesh logs.
  node_name: "mango-node-primary"

  # Purpose: UDP/TCP port for P2P mesh cluster communication.
  # Valid Values: 1024 to 65535 (default 7946)
  # Recommended Production Value: 7946
  # Performance Impact: Low overhead.
  # Security Impact: Must be secured via firewall or encrypted mesh key.
  bind_port: 7946

  # Purpose: IP address advertised to other cluster members.
  # Valid Values: IP string ("103.77.246.198", "172.19.0.2")
  # Recommended Production Value: Auto-detected or container IP
  # Performance Impact: None
  # Security Impact: Ensures correct peer routing.
  advertise_ip: ""

  # Purpose: Existing cluster peer addresses to join on startup.
  # Valid Values: Array of host:port strings (e.g. ["10.0.0.2:7946"])
  # Recommended Production Value: [] for single/primary node, peer IPs for secondary nodes
  # Performance Impact: None
  # Security Impact: Establishes cluster membership.
  join_peers: []

  # Purpose: Encryption key for P2P mesh cluster traffic.
  # Valid Values: Secret string or ${MANGO_CLUSTER_SECRET}
  # Recommended Production Value: "${MANGO_CLUSTER_SECRET}"
  # Performance Impact: AES encryption for gossip packets.
  # Security Impact: Prevents rogue nodes from injecting fake IP bans into mesh.
  secret_key: "${MANGO_CLUSTER_SECRET}"

# ------------------------------------------------------------------------------
# eBPF / XDP HARDWARE PACKET FILTERING
# Zero-CPU Linux kernel NIC driver packet dropping
# ------------------------------------------------------------------------------
xdp:
  # Purpose: Enable Linux eBPF / XDP hardware NIC packet dropping.
  # Valid Values: true, false
  # Recommended Production Value: true
  # Performance Impact: Drops 10,000,000+ packets/sec at NIC driver layer with 0% CPU usage.
  # Security Impact: Ultimate volumetric DDoS protection mechanism in Linux kernel.
  enabled: true

  # Purpose: Network interface name to attach XDP filter.
  # Valid Values: "eth0", "ens3", "enp1s0", "veth*"
  # Recommended Production Value: "eth0"
  # Performance Impact: Direct hardware NIC queue access.
  # Security Impact: Filters packets before Linux kernel TCP/IP stack allocation.
  interface: "eth0"

  # Purpose: XDP operational mode.
  # Valid Values: "skb" (generic), "drv" (native driver), "offload" (smartNIC hardware)
  # Recommended Production Value: "skb" (works across all virtual Ethernet / VPS NICs)
  # Performance Impact: "drv" > "skb". "skb" works universally across all cloud providers.
  # Security Impact: High capacity packet discard.
  mode: "skb"

  # Purpose: Pinned BPF map filesystem path for persistence across restarts.
  # Valid Values: Path string ("/sys/fs/bpf/mango_blacklist")
  # Recommended Production Value: "/sys/fs/bpf/mango_blacklist"
  # Performance Impact: Native zero-fork sys_bpf syscall updates.
  # Security Impact: Pinned kernel BPF map remains active even if daemon restarts.
  map_pin_path: "/sys/fs/bpf/mango_blacklist"

  # Purpose: Automatically compile xdp/mango_xdp.c into eBPF object on startup if missing.
  # Valid Values: true, false
  # Recommended Production Value: true
  # Performance Impact: One-time compilation during container startup via clang.
  # Security Impact: Ensures eBPF bytecode matches kernel headers.
  auto_compile: true

  # Purpose: Automatically attach compiled XDP program to network interface on startup.
  # Valid Values: true, false
  # Recommended Production Value: true
  # Performance Impact: Attaches XDP filter to network interface.
  # Security Impact: Drops packets at NIC layer before kernel allocation.
  auto_attach: true
