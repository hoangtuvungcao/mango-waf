# ==============================================================================
# MANGO SHIELD WAF v2.0 — Default Configuration
# ==============================================================================

server:
  listen: "0.0.0.0:443"
  http_listen: "0.0.0.0:80"
  read_timeout: 10s
  write_timeout: 30s
  idle_timeout: 60s
  max_header_bytes: 1048576

tls:
  enabled: true
  cert_file: "certs/server.crt"
  key_file: "certs/server.key"
  auto_cert: false
  acme_email: "admin@hidev.dev"
  min_version: "1.2"

domains:
  - name: "firewall.hidev.dev"
    upstreams:
      - url: "http://mango-test-site:8080"
        weight: 1
    ssl: true
  - name: "localhost"
    upstreams:
      - url: "http://mango-test-site:8080"
        weight: 1
    ssl: false

proxy:
  connect_timeout: 5s
  response_timeout: 30s
  max_idle_conns: 100
  keep_alive: true
  websocket: true

protection:
  mode: "auto"
  whitelist_ips:
    - "127.0.0.1/32"
  trusted_proxies:
    - "127.0.0.1/32"
    - "172.16.0.0/12"
    - "10.0.0.0/8"
  rate_limit:
    enabled: true
    requests_per_second: 100
    burst: 200
    per_ip: true
    adaptive: true
  connection_limit:
    max_per_ip: 100
    max_total: 50000
  challenge:
    pow_difficulty: 2
    pow_adaptive: true
    cookie_ttl: 1h
    cookie_secret: "mangoshieldsupersecretcookiek3y32b"
  ban:
    duration: 1h
    max_fails: 10
    use_iptables: true
  emergency:
    rps_threshold: 5000
    duration: 10m
    auto_enable: true

fingerprint:
  ja3:
    enabled: true
    block_unknown: false
  ja4:
    enabled: true
  http2:
    enabled: true
  ua_consistency:
    enabled: true
    strict: false

intelligence:
  geoip:
    enabled: true
    db_path: "data/GeoLite2-Country.mmdb"
    blocked_countries: []
    allowed_countries: []
  ip_reputation:
    enabled: true
    abuseipdb_key: ""
    cache_ttl: 12h
  asn:
    enabled: true
    block_datacenter: false

detection:
  baseline:
    enabled: true
    learning_period: 15m
  anomaly:
    enabled: true
    sensitivity: 2.0
  bot_classifier:
    enabled: true
    model_path: "rules/bot_model.json"
  session_tracking:
    enabled: true
    ttl: 30m

waf:
  enabled: true
  owasp_rules: true
  custom_rules_path: "rules/"
  paranoia_level: 2

logging:
  level: "info"
  format: "json"
  file: "logs/mango-shield.log"
  max_size_mb: 100
  max_backups: 10
  attack_log: "logs/attack.log"

metrics:
  enabled: true
  listen: "0.0.0.0:9100"
  path: "/metrics"

dashboard:
  enabled: true
  listen: "0.0.0.0:9090"
  username: "admin"
  password: "admin123_change_in_production"
  jwt_secret: "mangoshielddashboardjwtsecretkey32"

alerts:
  telegram:
    enabled: false
    token: ""
    chat_id: ""
  discord:
    enabled: false
    webhook_url: ""
  webhook:
    enabled: false
    url: ""
    secret: ""

cdn:
  enabled: true
  memory_limit_mb: 256
  static_extensions:
    - ".css"
    - ".js"
    - ".png"
    - ".jpg"
    - ".jpeg"
    - ".gif"
    - ".svg"
    - ".woff"
    - ".woff2"
    - ".ttf"
    - ".ico"
    - ".webp"
  bypass_rules:
    - "/api/*"
    - "/dashboard/*"
    - "/admin/*"
    - "/login"
  bypass_cookies:
    - "session_id"
    - "auth_token"
    - "mango_admin_session"
  bypass_headers:
    - "Authorization"

cluster:
  enabled: true
  node_name: "mango-node-primary"
  bind_port: 7946
  advertise_ip: ""
  join_peers: []
  secret_key: "mangoshieldclustersecretkey32"

xdp:
  enabled: true
  interface: "eth0"
  mode: "skb"
  map_pin_path: "/sys/fs/bpf/mango_blacklist"
  auto_compile: true
  auto_attach: true
